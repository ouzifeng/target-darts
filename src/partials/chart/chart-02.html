<div
  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
  x-data="{
    target: 450000,
    actual: 412000,
    get pct() { return Math.round((this.actual / this.target) * 100) },
    get remaining() { return this.target - this.actual }
  }"
>
  <div class="px-5 pt-5 sm:px-6 sm:pt-6">
    <div class="flex justify-between mb-2">
      <div>
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
          Monthly Sales Target
        </h3>
        <p class="text-theme-sm mt-1 text-gray-500 dark:text-gray-400">
          March 2026 — B2B portal revenue
        </p>
      </div>
    </div>

    <!-- Dartboard Target Visualisation -->
    <div class="flex items-center justify-center py-6">
      <div class="relative" style="width: 220px; height: 220px;">
        <!-- SVG Dartboard -->
        <svg viewBox="0 0 220 220" class="w-full h-full">
          <!-- Outer ring - dark -->
          <circle cx="110" cy="110" r="108" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
          <!-- Number ring background -->
          <circle cx="110" cy="110" r="100" fill="#232323"/>

          <!-- Scoring segments (alternating dark/light like a real board) -->
          <!-- Outer double ring -->
          <circle cx="110" cy="110" r="95" fill="none" stroke="#333" stroke-width="8"/>

          <!-- Main scoring area - shows progress -->
          <circle cx="110" cy="110" r="85" fill="#1a1a1a"/>

          <!-- Progress ring (gold, animated) -->
          <circle
            cx="110" cy="110" r="85"
            fill="none"
            stroke="#f6a429"
            stroke-width="10"
            stroke-dasharray="534"
            :stroke-dashoffset="534 - (534 * pct / 100)"
            stroke-linecap="round"
            transform="rotate(-90 110 110)"
            class="transition-all duration-1000"
            style="filter: drop-shadow(0 0 6px rgba(246,164,41,0.4));"
          />

          <!-- Track ring -->
          <circle cx="110" cy="110" r="85" fill="none" stroke="#333" stroke-width="10" opacity="0.3"/>
          <!-- Progress ring on top -->
          <circle
            cx="110" cy="110" r="85"
            fill="none"
            stroke="#f6a429"
            stroke-width="10"
            stroke-dasharray="534"
            :stroke-dashoffset="534 - (534 * pct / 100)"
            stroke-linecap="round"
            transform="rotate(-90 110 110)"
            class="transition-all duration-1000"
            style="filter: drop-shadow(0 0 6px rgba(246,164,41,0.4));"
          />

          <!-- Treble ring -->
          <circle cx="110" cy="110" r="60" fill="none" stroke="#444" stroke-width="1"/>

          <!-- Inner bull (green) -->
          <circle cx="110" cy="110" r="28" fill="#2d2d2d" stroke="#444" stroke-width="1"/>

          <!-- Outer bull -->
          <circle cx="110" cy="110" r="16" fill="#c0392b" stroke="#922" stroke-width="1"/>

          <!-- Bullseye (inner) -->
          <circle cx="110" cy="110" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>

          <!-- Wire lines (dartboard segments) -->
          <g stroke="#555" stroke-width="0.5" opacity="0.4">
            <line x1="110" y1="12" x2="110" y2="208" />
            <line x1="12" y1="110" x2="208" y2="110" />
            <line x1="38" y1="38" x2="182" y2="182" />
            <line x1="182" y1="38" x2="38" y2="182" />
            <line x1="25" y1="65" x2="195" y2="155" />
            <line x1="25" y1="155" x2="195" y2="65" />
            <line x1="65" y1="25" x2="155" y2="195" />
            <line x1="155" y1="25" x2="65" y2="195" />
            <line x1="50" y1="195" x2="170" y2="25" />
            <line x1="50" y1="25" x2="170" y2="195" />
          </g>

          <!-- Centre percentage text -->
          <text x="110" y="106" text-anchor="middle" class="fill-white" style="font-size: 28px; font-weight: 700; font-family: Inter, sans-serif;" x-text="pct + '%'"></text>
          <text x="110" y="122" text-anchor="middle" class="fill-gray-400" style="font-size: 10px; font-weight: 500; font-family: Inter, sans-serif;">OF TARGET</text>
        </svg>

        <!-- Dart icon overlaid (top right, like a dart stuck in the board) -->
        <div class="absolute -top-1 -right-1 text-2xl" style="transform: rotate(15deg);">
          🎯
        </div>
      </div>
    </div>

    <!-- Status message -->
    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mb-4">
      <span class="text-success-600 dark:text-success-400 font-semibold">£<span x-text="(actual/1000).toFixed(0)">412</span>K</span> of
      <span class="font-semibold text-gray-700 dark:text-gray-300">£<span x-text="(target/1000).toFixed(0)">450</span>K</span> target —
      <span class="font-medium">£<span x-text="(remaining/1000).toFixed(0)">38</span>K to go</span>
    </p>
  </div>

  <!-- Stats footer -->
  <div
    class="flex items-center justify-center gap-5 border-t border-gray-200 dark:border-gray-800 px-6 py-3.5 sm:gap-8 sm:py-5"
  >
    <div>
      <p class="text-theme-xs mb-1 text-center text-gray-500 sm:text-sm dark:text-gray-400">
        Orders
      </p>
      <p class="text-base font-semibold text-gray-800 sm:text-lg dark:text-white/90 text-center">
        342
      </p>
    </div>
    <div class="h-7 w-px bg-gray-200 dark:bg-gray-800"></div>
    <div>
      <p class="text-theme-xs mb-1 text-center text-gray-500 sm:text-sm dark:text-gray-400">
        Avg Order
      </p>
      <p class="text-base font-semibold text-gray-800 sm:text-lg dark:text-white/90 text-center">
        £1,204
      </p>
    </div>
    <div class="h-7 w-px bg-gray-200 dark:bg-gray-800"></div>
    <div>
      <p class="text-theme-xs mb-1 text-center text-gray-500 sm:text-sm dark:text-gray-400">
        Today
      </p>
      <p class="flex items-center justify-center gap-1 text-base font-semibold text-gray-800 sm:text-lg dark:text-white/90">
        £18.5K
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M7.60141 2.33683C7.73885 2.18084 7.9401 2.08243 8.16435 2.08243C8.16475 2.08243 8.16516 2.08243 8.16556 2.08243C8.35773 2.08219 8.54998 2.15535 8.69664 2.30191L12.6968 6.29924C12.9898 6.59203 12.9899 7.0669 12.6971 7.3599C12.4044 7.6529 11.9295 7.65306 11.6365 7.36027L8.91435 4.64004L8.91435 13.5C8.91435 13.9142 8.57856 14.25 8.16435 14.25C7.75013 14.25 7.41435 13.9142 7.41435 13.5L7.41435 4.64442L4.69679 7.36025C4.4038 7.65305 3.92893 7.6529 3.63613 7.35992C3.34333 7.06693 3.34348 6.59206 3.63646 6.29926L7.60141 2.33683Z" fill="#039855"/>
        </svg>
      </p>
    </div>
  </div>
</div>
