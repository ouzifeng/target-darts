<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>My Orders | Target Darts Trade Portal</title>
  </head>
  <body
    x-data="{
      page: 'buyerOrders',
      loaded: true,
      darkMode: false,
      status: 'all',
      search: '',
      open: null,
      toast: '',
      get mine() { return TD.ordersFor(TD.buyer.companyId); },
      get filtered() {
        const q = this.search.toLowerCase();
        return this.mine.filter(o => (this.status === 'all' || o.status === this.status) &&
          (!q || (o.id + ' ' + o.po + ' ' + o.items.map(i => i.name + ' ' + i.sku).join(' ')).toLowerCase().includes(q)));
      },
      count(s) { return this.mine.filter(o => o.status === s).length; },
      reorder(o) {
        o.items.forEach(i => TD.cart.add(i.sku, i.qty, i.variant));
        this.toast = o.lines + ' lines from ' + o.id + ' added to your basket';
        clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 3000);
      },
    }"
    x-init="
      darkMode = JSON.parse(localStorage.getItem('darkMode'));
      $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <include src="./partials/preloader.html"></include>

    <div class="flex min-h-screen flex-col bg-white dark:bg-gray-900">
      <include src="./partials/buyer-nav.html"></include>

      <main class="flex-1 py-8">
        <div class="mx-auto max-w-screen-2xl px-4 sm:px-6 lg:px-8">
          <h1 class="td-title text-4xl font-semibold text-gray-900 dark:text-white">My orders</h1>
          <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Every order placed by <span x-text="TD.buyer.company"></span>, from the portal, by CSV, by email or through your rep.</p>

          <div class="mt-6 grid grid-cols-2 gap-3 md:grid-cols-4">
            <div class="bg-[#f4f4f4] p-4 dark:bg-gray-800"><p class="text-xs tracking-wider text-gray-500 uppercase">Orders this year</p><p class="text-2xl font-bold text-gray-900 dark:text-white" x-text="mine.length"></p></div>
            <div class="bg-[#f4f4f4] p-4 dark:bg-gray-800"><p class="text-xs tracking-wider text-gray-500 uppercase">In progress</p><p class="text-2xl font-bold text-gray-900 dark:text-white" x-text="mine.filter(o => ['new','pending approval','approved','picking'].includes(o.status)).length"></p></div>
            <div class="bg-[#f4f4f4] p-4 dark:bg-gray-800"><p class="text-xs tracking-wider text-gray-500 uppercase">On the way</p><p class="text-2xl font-bold text-gray-900 dark:text-white" x-text="count('dispatched')"></p></div>
            <div class="bg-[#f4f4f4] p-4 dark:bg-gray-800"><p class="text-xs tracking-wider text-gray-500 uppercase">Spend ex VAT</p><p class="text-2xl font-bold text-gray-900 dark:text-white" x-text="TD.gbp(mine.filter(o => o.status !== 'cancelled').reduce((s, o) => s + o.total, 0))"></p></div>
          </div>

          <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
            <div class="no-scrollbar flex gap-2 overflow-x-auto">
              <template x-for="s in ['all', 'pending approval', 'new', 'approved', 'picking', 'dispatched', 'delivered', 'cancelled']" :key="s">
                <button @click="status = s" :class="status === s ? 'bg-ink text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300'" class="rounded-sm px-3 py-1.5 text-xs font-semibold whitespace-nowrap uppercase" x-text="s === 'all' ? 'All' : TD.statusLabel(s)"></button>
              </template>
            </div>
            <input type="search" x-model="search" placeholder="Order, PO, SKU or product" class="h-10 w-72 border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
          </div>

          <div class="mt-4 divide-y divide-gray-200 border-y border-gray-200 dark:divide-gray-800 dark:border-gray-800">
            <template x-for="o in filtered" :key="o.id">
              <div>
                <div class="flex flex-wrap items-center gap-4 py-4">
                  <div class="flex -space-x-3">
                    <template x-for="i in o.items.slice(0, 4)" :key="i.sku + i.variant">
                      <img :src="i.image" :alt="i.name" class="h-12 w-12 rounded-full border-2 border-white bg-[#f4f4f4] object-contain dark:border-gray-900" />
                    </template>
                  </div>
                  <div class="min-w-48 flex-1">
                    <p class="font-semibold text-gray-900 dark:text-white"><span x-text="o.id"></span> <span class="ml-2 text-xs font-normal text-gray-500" x-text="o.po"></span></p>
                    <p class="text-xs text-gray-500" x-text="TD.date(o.date) + ' · ' + o.lines + ' lines · ' + o.units + ' units · via ' + o.channel"></p>
                  </div>
                  <span :class="TD.statusCss(o.status)" class="rounded-full px-2.5 py-1 text-xs font-semibold" x-text="TD.statusLabel(o.status)"></span>
                  <p class="w-28 text-right font-bold text-gray-900 dark:text-white" x-text="TD.gbp(o.total)"></p>
                  <div class="flex gap-2">
                    <button @click="open = open === o.id ? null : o.id" class="border border-gray-300 px-3 py-2 text-xs font-semibold uppercase hover:border-gray-900 dark:border-gray-600 dark:text-gray-200" x-text="open === o.id ? 'Hide' : 'Details'"></button>
                    <button @click="reorder(o)" class="bg-ink px-3 py-2 text-xs font-semibold text-white uppercase hover:bg-brand-500">Reorder</button>
                  </div>
                </div>
                <div x-show="open === o.id" class="mb-4 bg-[#f9f9f9] p-4 dark:bg-gray-800" style="display: none">
                  <p x-show="o.carrier" class="mb-3 text-sm text-gray-700 dark:text-gray-300">Shipped with <strong x-text="o.carrier"></strong> &middot; ERP ref <span x-text="o.erpRef"></span></p>
                  <table class="w-full text-sm">
                    <thead><tr class="text-left text-xs tracking-wider text-gray-500 uppercase"><th class="py-1">Product</th><th>SKU</th><th class="text-right">Qty</th><th class="text-right">Unit</th><th class="text-right">Total</th></tr></thead>
                    <tbody>
                      <template x-for="i in o.items" :key="'r' + i.sku + i.variant">
                        <tr class="border-t border-gray-200 dark:border-gray-700 dark:text-gray-300">
                          <td class="py-2"><a :href="'buyer-product-detail.html?sku=' + i.sku" class="hover:underline" x-text="i.name + (i.variant ? ' (' + i.variant + ')' : '')"></a></td>
                          <td class="text-gray-500" x-text="i.sku"></td>
                          <td class="text-right" x-text="i.qty"></td>
                          <td class="text-right" x-text="TD.gbp(i.price)"></td>
                          <td class="text-right font-semibold" x-text="TD.gbp(i.qty * i.price)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <p class="mt-3 text-right text-sm text-gray-600 dark:text-gray-400">Net <strong x-text="TD.gbp(o.total)"></strong> &middot; VAT <span x-text="TD.gbp(o.vat)"></span> &middot; Gross <strong x-text="TD.gbp(o.gross)"></strong></p>
                </div>
              </div>
            </template>
            <p x-show="!filtered.length" class="py-16 text-center text-gray-500">No orders match those filters.</p>
          </div>
        </div>
      </main>

      <include src="./partials/buyer-footer.html"></include>
    </div>

    <div x-show="toast" x-transition class="fixed right-6 bottom-6 z-[60] flex items-center gap-3 rounded-sm bg-ink px-4 py-3 text-sm text-white shadow-2xl" style="display: none">
      <span x-text="toast"></span>
      <a href="buyer-cart.html" class="ml-2 font-semibold text-brand-300 underline">View basket</a>
    </div>
  </body>
</html>
