<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Shop Trade | Target Darts Trade Portal</title>
  </head>
  <body
    x-data="{
      page: 'buyerProducts',
      loaded: true,
      darkMode: false,
      search: TD.param('q') || '',
      category: TD.param('cat') || 'all',
      player: TD.param('player') || 'all',
      inStock: false,
      beginner: false,
      sortBy: 'featured',
      shown: 24,
      qty: {},
      toast: '',
      get players() { return TD.players.slice(0, 14); },
      get filtered() {
        const q = this.search.trim().toLowerCase();
        let list = TD.catalog.filter(p =>
          (this.category === 'all' || p.category === this.category) &&
          (this.player === 'all' || p.player === this.player) &&
          (!this.inStock || p.stock > 0) &&
          (!this.beginner || p.beginner) &&
          (!q || (p.name + ' ' + p.sku + ' ' + p.player + ' ' + p.category + ' ' + p.ean).toLowerCase().includes(q))
        );
        const s = this.sortBy;
        if (s === 'price-low') list = [...list].sort((a, b) => a.net - b.net);
        else if (s === 'price-high') list = [...list].sort((a, b) => b.net - a.net);
        else if (s === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
        else if (s === 'margin') list = [...list].sort((a, b) => TD.margin(b, this.buy(b)) - TD.margin(a, this.buy(a)));
        else list = [...list].sort((a, b) => (b.bestseller - a.bestseller) || ((b.stock > 0) - (a.stock > 0)));
        return list;
      },
      buy(p) { return TD.netPrice(p, TD.buyer.discount, 1); },
      q(p) { return this.qty[p.sku] || p.moq; },
      add(p) {
        const variant = p.variants.length ? p.variants[0].values[0] : '';
        TD.cart.add(p.sku, this.q(p), variant);
        this.toast = this.q(p) + ' x ' + p.name + (variant ? ' (' + variant + ')' : '') + ' added';
        clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 2600);
      },
      reset() { this.search = ''; this.category = 'all'; this.player = 'all'; this.inStock = false; this.beginner = false; this.shown = 24; },
    }"
    x-init="
      darkMode = JSON.parse(localStorage.getItem('darkMode'));
      $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)));
      $watch('category', () => shown = 24); $watch('player', () => shown = 24); $watch('search', () => shown = 24);
    "
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <include src="./partials/preloader.html"></include>

    <div class="flex min-h-screen flex-col bg-white dark:bg-gray-900">
      <include src="./partials/buyer-nav.html"></include>

      <!-- Category banner -->
      <section class="border-b border-gray-200 bg-[#f4f4f4] dark:border-gray-800 dark:bg-gray-800">
        <div class="mx-auto max-w-screen-2xl px-4 py-6 sm:px-6 lg:px-8">
          <p class="text-xs text-gray-500">Home <span class="mx-1">&rsaquo;</span> Shop Trade <span x-show="category !== 'all'"><span class="mx-1">&rsaquo;</span><span x-text="category"></span></span></p>
          <div class="mt-2 flex flex-wrap items-end justify-between gap-3">
            <h1 class="td-title text-4xl font-semibold text-gray-900 dark:text-white" x-text="category === 'all' ? (player === 'all' ? 'Trade Catalogue' : player) : category"></h1>
            <p class="text-sm text-gray-600 dark:text-gray-400">
              Showing <strong x-text="filtered.length"></strong> products &middot; your <span x-text="TD.buyer.tier"></span> price applied
            </p>
          </div>
          <!-- category chips -->
          <div class="no-scrollbar mt-4 flex gap-2 overflow-x-auto pb-1">
            <button @click="category = 'all'" :class="category === 'all' ? 'bg-ink text-white' : 'bg-white text-gray-700 hover:bg-gray-200'" class="rounded-sm px-3 py-1.5 text-xs font-semibold whitespace-nowrap uppercase">All</button>
            <template x-for="c in TD.categories" :key="c.name">
              <button @click="category = c.name" :class="category === c.name ? 'bg-ink text-white' : 'bg-white text-gray-700 hover:bg-gray-200'" class="rounded-sm px-3 py-1.5 text-xs font-semibold whitespace-nowrap uppercase" x-text="c.name"></button>
            </template>
          </div>
        </div>
      </section>

      <main class="flex-1 py-8">
        <div class="mx-auto max-w-screen-2xl px-4 sm:px-6 lg:px-8">
          <div class="grid grid-cols-1 gap-8 lg:grid-cols-4">
            <!-- Filters -->
            <aside class="lg:col-span-1">
              <div class="sticky top-32 space-y-6">
                <div>
                  <p class="font-display mb-3 text-lg tracking-wide text-gray-900 uppercase dark:text-white">Filter options</p>
                  <input type="search" x-model.debounce.200ms="search" placeholder="SKU, EAN, name or player" class="h-10 w-full rounded-sm border border-gray-300 px-3 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
                </div>
                <div class="border-t border-gray-200 pt-4 dark:border-gray-800">
                  <p class="mb-2 text-xs font-semibold tracking-wider text-gray-500 uppercase">Categories</p>
                  <button @click="category = 'all'" class="flex w-full items-center justify-between py-1 text-sm" :class="category === 'all' ? 'font-semibold text-brand-600' : 'text-gray-700 dark:text-gray-300'">
                    <span>All products</span><span class="text-xs text-gray-400" x-text="TD.catalog.length"></span>
                  </button>
                  <template x-for="c in TD.categories" :key="c.name">
                    <button @click="category = c.name" class="flex w-full items-center justify-between py-1 text-sm" :class="category === c.name ? 'font-semibold text-brand-600' : 'text-gray-700 hover:text-gray-900 dark:text-gray-300'">
                      <span x-text="c.name"></span><span class="text-xs text-gray-400" x-text="c.count"></span>
                    </button>
                  </template>
                </div>
                <div class="border-t border-gray-200 pt-4 dark:border-gray-800">
                  <p class="mb-2 text-xs font-semibold tracking-wider text-gray-500 uppercase">Shop by player</p>
                  <select x-model="player" class="h-10 w-full rounded-sm border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                    <option value="all">All players &amp; ranges</option>
                    <template x-for="pl in TD.players" :key="pl.name"><option :value="pl.name" x-text="pl.name + ' (' + pl.count + ')'" :selected="pl.name === player"></option></template>
                  </select>
                </div>
                <div class="space-y-2 border-t border-gray-200 pt-4 text-sm text-gray-700 dark:border-gray-800 dark:text-gray-300">
                  <label class="flex items-center gap-2"><input type="checkbox" x-model="inStock" class="rounded-sm text-brand-500" /> In stock only</label>
                  <label class="flex items-center gap-2"><input type="checkbox" x-model="beginner" class="rounded-sm text-brand-500" /> Best for beginners</label>
                </div>
                <div class="border-t border-gray-200 pt-4 dark:border-gray-800">
                  <p class="mb-2 text-xs font-semibold tracking-wider text-gray-500 uppercase">Volume pricing</p>
                  <template x-for="b in TD.volumeBreaks" :key="b.min">
                    <p class="flex justify-between py-0.5 text-sm text-gray-700 dark:text-gray-300"><span x-text="b.min + '+ units per line'"></span><span class="font-semibold text-brand-600" x-text="'extra ' + b.discount + '% off'"></span></p>
                  </template>
                </div>
                <button @click="reset()" class="w-full rounded-sm border border-gray-900 py-2 text-xs font-semibold tracking-wide uppercase hover:bg-ink hover:text-white dark:border-gray-500 dark:text-gray-200">Clear all filters</button>
              </div>
            </aside>

            <!-- Grid -->
            <section class="lg:col-span-3">
              <div class="mb-5 flex items-center justify-between gap-3">
                <div class="flex flex-wrap gap-2 text-xs">
                  <template x-if="player !== 'all'"><button @click="player = 'all'" class="rounded-full bg-gray-100 px-3 py-1 dark:bg-gray-800 dark:text-gray-300" x-text="player + ' &times;'"></button></template>
                  <template x-if="search"><button @click="search = ''" class="rounded-full bg-gray-100 px-3 py-1 dark:bg-gray-800 dark:text-gray-300" x-text="'&quot;' + search + '&quot; &times;'"></button></template>
                </div>
                <select x-model="sortBy" class="h-10 rounded-sm border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                  <option value="featured">Sort by: Featured</option>
                  <option value="margin">Best retail margin</option>
                  <option value="price-low">Trade price: low to high</option>
                  <option value="price-high">Trade price: high to low</option>
                  <option value="name">Name A-Z</option>
                </select>
              </div>

              <div class="grid grid-cols-2 gap-x-4 gap-y-8 md:grid-cols-3 xl:grid-cols-4">
                <template x-for="p in filtered.slice(0, shown)" :key="p.sku">
                  <article class="group flex flex-col">
                    <a :href="'buyer-product-detail.html?sku=' + p.sku" class="relative block aspect-square overflow-hidden bg-[#f4f4f4] dark:bg-gray-800">
                      <img :src="p.image" :alt="p.name" loading="lazy" class="h-full w-full object-contain mix-blend-multiply transition-transform duration-500 group-hover:scale-105 dark:mix-blend-normal" />
                      <span x-show="p.bestseller" class="absolute top-2 left-2 rounded-sm bg-ink px-2 py-0.5 text-[10px] font-bold tracking-wider text-white uppercase">Best seller</span>
                      <span x-show="p.status === 'clearance'" class="absolute top-2 left-2 rounded-sm bg-brand-500 px-2 py-0.5 text-[10px] font-bold tracking-wider text-white uppercase">Clearance</span>
                      <span x-show="p.images.length > 1" class="absolute right-2 bottom-2 rounded-sm bg-white/90 px-1.5 py-0.5 text-[10px] text-gray-600" x-text="p.images.length + ' photos'"></span>
                    </a>
                    <div class="flex flex-1 flex-col pt-3">
                      <p class="text-[11px] tracking-wide text-gray-500 uppercase" x-text="p.player || p.category"></p>
                      <a :href="'buyer-product-detail.html?sku=' + p.sku" class="font-display mt-0.5 line-clamp-2 text-[17px] leading-tight tracking-wide text-gray-900 uppercase hover:text-brand-600 dark:text-white" x-text="p.name"></a>
                      <p class="mt-1 text-[11px] text-gray-500">SKU <span x-text="p.sku"></span><span x-show="p.variants.length" x-text="p.variants.length ? ' &middot; ' + p.variants[0].values.length + ' ' + p.variants[0].name.toLowerCase().replace('dart ', '') + 's' : ''"></span></p>
                      <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-lg font-bold text-gray-900 dark:text-white" x-text="TD.gbp(buy(p))"></span>
                        <span class="text-[11px] text-gray-500">ex VAT <span x-show="p.pack > 1" x-text="'/ ' + p.unit.toLowerCase()"></span></span>
                      </div>
                      <p class="text-[11px] text-gray-500">RRP <span x-text="TD.gbp(p.rrp)"></span> &middot; <span class="font-semibold text-green-700" x-text="TD.margin(p, buy(p)) + '% margin'"></span></p>
                      <p class="mt-1 text-[11px]">
                        <span :class="p.stock === 0 ? 'text-red-600' : (p.stock < 20 ? 'text-orange-600' : 'text-green-700')" x-text="p.stock === 0 ? 'Out of stock: back order' : (p.stock < 20 ? 'Low stock: ' + p.stock + ' left' : p.stock + ' in stock')"></span>
                      </p>
                      <div class="mt-auto flex items-center gap-2 pt-3">
                        <div class="flex h-9 items-center rounded-sm border border-gray-300 dark:border-gray-700">
                          <button @click="qty[p.sku] = Math.max(p.moq, q(p) - p.moq)" class="w-7 text-gray-500">&minus;</button>
                          <input type="number" :value="q(p)" @change="qty[p.sku] = Math.max(p.moq, +$event.target.value || p.moq)" class="w-9 border-0 p-0 text-center text-sm focus:ring-0 dark:bg-transparent dark:text-white" />
                          <button @click="qty[p.sku] = q(p) + p.moq" class="w-7 text-gray-500">+</button>
                        </div>
                        <button @click="add(p)" class="h-9 flex-1 rounded-sm bg-ink text-xs font-semibold tracking-wide text-white uppercase transition-colors hover:bg-brand-500">Add</button>
                      </div>
                      <p x-show="p.moq > 1" class="mt-1 text-[10px] text-gray-400" x-text="'Sold in outers of ' + p.moq"></p>
                    </div>
                  </article>
                </template>
              </div>

              <div x-show="filtered.length === 0" class="py-20 text-center">
                <p class="font-display text-2xl text-gray-900 uppercase dark:text-white">No products match</p>
                <button @click="reset()" class="mt-4 rounded-sm bg-ink px-5 py-2 text-sm text-white">Clear filters</button>
              </div>

              <div x-show="shown < filtered.length" class="mt-10 text-center">
                <p class="mb-3 text-xs text-gray-500" x-text="'Showing ' + Math.min(shown, filtered.length) + ' of ' + filtered.length"></p>
                <button @click="shown += 24" class="rounded-sm border border-gray-900 px-8 py-3 text-xs font-semibold tracking-wider uppercase hover:bg-ink hover:text-white dark:border-gray-500 dark:text-white">Load more</button>
              </div>
            </section>
          </div>
        </div>
      </main>

      <include src="./partials/buyer-footer.html"></include>
    </div>

    <div x-show="toast" x-transition class="fixed right-6 bottom-6 z-[60] flex items-center gap-3 rounded-sm bg-ink px-4 py-3 text-sm text-white shadow-2xl" style="display: none">
      <svg class="h-5 w-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
      <span x-text="toast"></span>
      <a href="buyer-cart.html" class="ml-2 font-semibold text-brand-300 underline">View basket</a>
    </div>
  </body>
</html>
